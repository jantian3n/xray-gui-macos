name: xray_gui
description: Android-first GUI shell for Xray.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  tray_manager: ^0.5.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bootstrap-geodata/
    - assets/bin/README.txt
    - assets/bin/macos/xray
    - assets/bin/windows/xray.exe
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_16.png
